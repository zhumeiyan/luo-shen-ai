<title>顿一</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;min-height:100vh;display:flex;flex-direction:column}
.header{text-align:center;padding:20px 15px 10px}
.header h1{color:#e94560;font-size:28px;font-weight:300;letter-spacing:4px}
.stats{text-align:center;color:#666;font-size:12px;padding:5px;margin-bottom:10px;min-height:20px}
.content{flex:1;padding:0 15px;overflow-y:auto}
.reply-box{background:#16213e;padding:20px;border-radius:15px;min-height:150px;margin-bottom:20px;white-space:pre-wrap;line-height:1.8;font-size:16px}
.reply-placeholder{color:#444}
.footer{text-align:center;padding:15px;display:flex;flex-direction:column;align-items:center;gap:10px}
.mic-btn{background:#e94560;color:#fff;border:none;border-radius:50%;width:64px;height:64px;font-size:26px;cursor:pointer;transition:all .2s}
.mic-btn:active{background:#ff6b6b;transform:scale(0.92)}
.mic-btn.listening{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(233,69,96,.5)}50%{box-shadow:0 0 0 20px rgba(233,69,96,0)}}
.status-text{color:#888;font-size:13px;text-align:center;min-height:20px}
.install-hint{position:fixed;bottom:0;left:0;right:0;background:rgba(233,69,96,.95);color:#fff;text-align:center;padding:10px;font-size:13px;display:none}

<body>
<div class="header"><h1>顿一</h1></div>
<div class="stats" id="stats">r = 0.0000 &nbsp;|&nbsp; tau = 0.0000 &nbsp;|&nbsp; n = 0</div>
<div class="content"><div class="reply-box" id="reply"><span class="reply-placeholder">点麦克风开始对话…</span></div></div>
<div class="footer">
  <div class="status-text" id="status">麦克风就绪</div>
  <button class="mic-btn" id="mic">🎤</button>
</div>
<div class="install-hint" id="installHint">⋮ → 添加到主屏幕 → 像 APP 一样用</div>

<script>
// === 遁一引擎（纯 JS） ===
const R_STAR = 0.5436890130;
let A = [1.0, 0.0, 0.0];
let B = [-0.4, 0.5, 0.2];
let TAU = 0.0;
let N = 0;

function norm(v){return Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2])}

function step(a, b){
  const delta=[b[0]-a[0],b[1]-a[1],b[2]-a[2]];
  const sigma=[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
  const d=norm(delta), s=norm(sigma), tot=d+s+1e-300;
  const a2=[(s*sigma[0]+d*delta[0])/tot,(s*sigma[1]+d*delta[1])/tot,(s*sigma[2]+d*delta[2])/tot];
  const b2=[(s*delta[0]+d*sigma[0])/tot,(s*delta[1]+d*sigma[1])/tot,(s*delta[2]+d*sigma[2])/tot];
  return {a2,b2,delta,sigma,d,s};
}

function encode(text){
  let h=0;
  for(let i=0;i<text.length;i++){h=(h*131+text.charCodeAt(i))&0xffffffff}
  return [(h%1000)/1000.0,((h>>10)%1000)/1000.0,((h>>20)%1000)/1000.0];
}

function tauUpdate(d,s,r){
  const dev=Math.abs(r-R_STAR);
  const lam=Math.min(0.5, Math.max(0.001, dev*2.0));
  TAU=(1-lam)*TAU+lam*(d-s);
  return TAU;
}

function doStep(bNew){
  const st=step(A,B);
  const r=st.d/(st.s+1e-300);
  const c=(st.delta[0]*st.sigma[0]+st.delta[1]*st.sigma[1]+st.delta[2]*st.sigma[2])/(st.d*st.s+1e-300);
  const t=tauUpdate(st.d,st.s,r);
  A=st.a2; B=st.b2; N++;
  return {A,B,r,c,t,N};
}

// === LLM ===
const ZHIPU_KEY='3121fdd55f9340cba35f39fa2e312bc5.c4KrVxtLCPdCgARq';

async function callLLM(text, tone){
  try{
    const res=await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+ZHIPU_KEY},
      body:JSON.stringify({model:'glm-4-flash',messages:[
        {role:'system',content:'只回一句话，'+tone+'。不解释，不比喻。'},
        {role:'user',content:text}
      ]})
    });
    if(!res.ok) return null;
    const j=await res.json();
    return j.choices[0].message.content;
  }catch(e){return null;}
}

async function tick(text){
  const bNew=encode(text);
  const r1=doStep(bNew); // use current B as first input
  if(r1.t<-1e-9) return {r:r1.r,c:r1.c,t:r1.t,n:N,reply:null,A,BA};
  const tone=Math.abs(r1.c)<0.3?'短':(r1.c<0?'沉':'轻');
  const reply=await callLLM(text,tone);
  return {r:r1.r,c:r1.c,t:r1.t,n:N,reply,A,B};
}

// === 语音 ===
const synth=window.speechSynthesis;

function speak(text){
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=0.9; u.pitch=0.95;
  const voices=synth.getVoices();
  const female=voices.find(v=>v.lang.startsWith('zh')&&(v.name.includes('Female')||v.name.includes('女')));
  const any=voices.find(v=>v.lang.startsWith('zh'));
  if(female) u.voice=female;
  else if(any) u.voice=any;
  synth.speak(u);
}

// === 语音识别 ===
let rec=null;

function recStart(){
  if(!('webkitSpeechRecognition' in window)){
    setStatus('此浏览器不支持语音，请用 Chrome');
    return;
  }
  rec=new webkitSpeechRecognition();
  rec.lang='zh-CN'; rec.continuous=false; rec.interimResults=false;
  micBtn.classList.add('listening');
  setStatus('… 正在听 …');
  rec.onresult=function(e){
    const t=e.results[0][0].transcript;
    setStatus('收到: '+t);
    handleInput(t);
  };
  rec.onerror=function(e){
    setStatus('收音失败: '+e.error);
    micBtn.classList.remove('listening');
  };
  rec.onend=function(){
    micBtn.classList.remove('listening');
  };
  rec.start();
}

// === UI ===
const micBtn=document.getElementById('mic');
const replyEl=document.getElementById('reply');
const statsEl=document.getElementById('stats');
const statusEl=document.getElementById('status');

function setStatus(t){statusEl.textContent=t;}
function updateStats(d){statsEl.textContent='r = '+d.r.toFixed(6)+' | c = '+d.c.toFixed(6)+' | tau = '+d.t.toFixed(6)+' | n = '+d.n;}
function showReply(text){replyEl.textContent=text;replyEl.style.color='#eee';}
function showPlaceholder(){replyEl.innerHTML='<span class="reply-placeholder">点麦克风开始对话…</span>';}

async function handleInput(text){
  setStatus('思考中…');
  const j=await tick(text);
  updateStats(j);
  if(j.reply){
    showReply(j.reply);
    speak(j.reply);
  } else {
    showReply('（沉默）');
    setStatus('她没说话 (tau=' + j.t.toFixed(4) + ')');
  }
}

micBtn.onclick=recStart;

// === 安装提示 ===
let deferredPrompt;
window.addEventListener('beforeinstallinstallprompt', e=>{
  e.preventDefault();
  deferredPrompt=e;
  document.getElementById('installHint').style.display='block';
  setTimeout(()=>{document.getElementById('installHint').style.display='none';},8000);
});

if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone){
  document.getElementById('installHint').style.display='none';
}

// === 初始化 voices ===
synth.onvoiceschanged=()=>synth.getVoices();
setTimeout(()=>synth.getVoices(),100);

updateStats({r:0,c:0,t:0,n:0});
</script>
